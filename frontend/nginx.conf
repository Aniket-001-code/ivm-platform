server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /health { return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /docs { proxy_pass http://backend:8000/docs; }
  location /openapi.json { proxy_pass http://backend:8000/openapi.json; }
  location / { try_files $uri $uri/ /index.html; }
}
