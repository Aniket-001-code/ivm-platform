apiVersion: apps/v1
kind: Deployment
metadata: { name: ivm-web, namespace: ivm }
spec:
  replicas: 2
  selector: { matchLabels: { app: ivm-web } }
  template:
    metadata: { labels: { app: ivm-web } }
    spec:
      containers:
        - name: web
          image: ivm-frontend:latest
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /health, port: 80 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] } }
---
apiVersion: v1
kind: Service
metadata: { name: ivm-web, namespace: ivm }
spec:
  selector: { app: ivm-web }
  ports: [{ port: 80, targetPort: 80 }]
