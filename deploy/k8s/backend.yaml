# Stateless API replicas: the in-process scheduler is disabled here; scheduler.yaml runs it once.
apiVersion: apps/v1
kind: Deployment
metadata: { name: ivm-api, namespace: ivm }
spec:
  replicas: 2
  selector: { matchLabels: { app: ivm-api } }
  template:
    metadata: { labels: { app: ivm-api } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: migrate
          image: ivm-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom: [{ configMapRef: { name: ivm-config } }, { secretRef: { name: ivm-secrets } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      containers:
        - name: api
          image: ivm-backend:latest
          envFrom: [{ configMapRef: { name: ivm-config } }, { secretRef: { name: ivm-secrets } }]
          env: [{ name: SCHEDULER_ENABLED, value: "false" }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /api/v1/health, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: ivm-api, namespace: ivm }
spec:
  selector: { app: ivm-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ivm-api, namespace: ivm }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ivm-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
