# Template only. Create the real secret with:
#   kubectl -n ivm create secret generic ivm-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_URL="postgresql+psycopg://ivm:<password>@ivm-db:5432/ivm" \
#     --from-literal=POSTGRES_PASSWORD="<password>" \
#     --from-literal=INTEGRATION_WEBHOOK_SECRET="$(openssl rand -hex 32)"
# Prefer an external secret manager (e.g. External Secrets Operator + a vault) in real use.
apiVersion: v1
kind: Secret
metadata:
  name: ivm-secrets
  namespace: ivm
type: Opaque
stringData:
  SECRET_KEY: "replace-me"
  DATABASE_URL: "replace-me"
  POSTGRES_PASSWORD: "replace-me"
  INTEGRATION_WEBHOOK_SECRET: "replace-me"
