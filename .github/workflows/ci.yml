name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check app tests
          black --check app tests
      - name: Type check
        run: mypy app
      - name: Tests with whole-backend coverage gate
        run: pytest --cov=app --cov-fail-under=70
      - name: Security scans
        run: |
          bandit -q -r app
          pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ivm_ci.sqlite
      SECRET_KEY: ci-only-secret-not-used-anywhere-else
      LOGIN_RATE_LIMIT: "100"
      AI_RATE_LIMIT: "200"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e "backend[dev]"
      - run: npm ci && npx playwright install --with-deps chromium
      - run: cd frontend && npm ci
      - name: Start API and web app
        run: |
          (cd backend && alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8000 &)
          (cd frontend && npm run dev -- --port 5173 &)
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
      - run: npx playwright test

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
